name: Build & Release

# Baut bei jeder Änderung an der App eine unsignierte KopfFit.ipa,
# veröffentlicht sie als GitHub-Release und aktualisiert die SideStore-Quelle.
on:
  push:
    branches: [main]
    paths:
      - "KopfFit/**"
      - "project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Version bestimmen
        id: version
        run: |
          BASE=$(grep 'MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (unsigniert, SideStore signiert beim Installieren)
        run: |
          xcodebuild -project KopfFit.xcodeproj -scheme KopfFit \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -n 30
          test -d build/Build/Products/Release-iphoneos/KopfFit.app

      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KopfFit.app Payload/
          zip -qr KopfFit.ipa Payload

      - name: SideStore-Quelle erzeugen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          SIZE=$(stat -f%z KopfFit.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES=$(git log -1 --pretty=%s)
          python3 - <<PY
          import json, os
          repo = os.environ["REPO"]
          tag = "v" + os.environ["VERSION"]
          source = {
              "name": "KopfFit",
              "identifier": f"io.github.{os.environ['OWNER'].lower()}.kopffit.source",
              "apps": [{
                  "name": "KopfFit",
                  "bundleIdentifier": "de.stefan.kopffit",
                  "developerName": os.environ["OWNER"],
                  "subtitle": "Täglich 5 Minuten Kopfrechnen",
                  "localizedDescription": "Adaptive Kopfrechenaufgaben mit Serie und hartnäckigen Erinnerungen.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/KopfFit/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                  "tintColor": "#5E5CE6",
                  "versions": [{
                      "version": os.environ["VERSION"],
                      "buildVersion": os.environ["BUILD"],
                      "date": "$DATE",
                      "localizedDescription": """$NOTES""",
                      "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/KopfFit.ipa",
                      "size": $SIZE,
                      "minOSVersion": "17.0",
                  }],
              }],
              "news": [],
          }
          json.dump(source, open("source.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat source.json

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" KopfFit.ipa source.json \
            --title "KopfFit ${{ steps.version.outputs.version }}" \
            --notes "$(git log -1 --pretty=%B)" --latest
