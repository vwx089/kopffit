name: Build & Release

# Baut bei jeder Änderung an der App eine unsignierte KopfFit.ipa,
# veröffentlicht sie als GitHub-Release. Die gemeinsame SideStore-Quelle
# (alle Apps) baut danach .github/workflows/source.yml.
on:
  push:
    branches: [main]
    paths:
      - "KopfFit/**"
      - "project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Version bestimmen
        id: version
        run: |
          BASE=$(grep 'MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (unsigniert, SideStore signiert beim Installieren)
        run: |
          set -o pipefail
          xcodebuild -project KopfFit.xcodeproj -scheme KopfFit \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -n 60
          # Sicherheitsnetz: ohne fertige App-Datei kein Release.
          test -f build/Build/Products/Release-iphoneos/KopfFit.app/KopfFit

      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KopfFit.app Payload/
          zip -qr KopfFit.ipa Payload

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" KopfFit.ipa \
            --title "KopfFit ${{ steps.version.outputs.version }}" \
            --notes "$(git log -1 --pretty=%B)" --latest

      - name: Gemeinsame SideStore-Quelle anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 sidestore/build_source.py source.json
          gh release upload "v${{ steps.version.outputs.version }}" source.json --clobber
