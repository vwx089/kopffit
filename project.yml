name: KopfFit
options:
  bundleIdPrefix: de.stefan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Hier deine Team-ID aus developer.apple.com > Membership eintragen
    # (oder in Xcode unter Signing & Capabilities das Team auswählen).
    DEVELOPMENT_TEAM: ""
targets:
  KopfFit:
    type: application
    platform: iOS
    sources:
      - KopfFit
    info:
      path: KopfFit/Info.plist
      properties:
        CFBundleDisplayName: KopfFit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
    # Dringliche Mitteilungen (Time Sensitive) gehen nur mit bezahltem Developer Account.
    # Dann diese drei Zeilen wieder einkommentieren:
    # entitlements:
    #   path: KopfFit/KopfFit.entitlements
    #   properties:
    #     com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.stefan.kopffit
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
